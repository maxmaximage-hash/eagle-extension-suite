<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAX Live Photo 管家</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-block">
      <img src="logo.png" alt="" class="brand-logo">
      <div>
        <h1>MAX Live Photo 管家</h1>
        <p id="sourcePath">正在读取样本目录</p>
      </div>
    </div>
    <div class="toolbar" role="toolbar" aria-label="预览队列">
      <button type="button" class="button primary" data-action="continue-anchor">继续上次</button>
      <button type="button" class="button" data-action="scan">重新扫描</button>
      <button type="button" class="icon-button" data-action="pause" title="暂停队列" aria-label="暂停队列">II</button>
      <button type="button" class="icon-button" data-action="resume" title="继续队列" aria-label="继续队列">&#9654;</button>
      <button type="button" class="button" data-action="retry">重试失败</button>
    </div>
  </header>

  <main>
    <section class="status-band" aria-label="批次进度">
      <div class="metric"><span>本批</span><strong id="countTotal">0</strong></div>
      <div class="metric success"><span>可预览</span><strong id="countReady">0</strong></div>
      <div class="metric"><span>处理中</span><strong id="countProcessing">0</strong></div>
      <div class="metric danger"><span>失败</span><strong id="countFailed">0</strong></div>
      <div class="metric warning"><span>待处理/冲突</span><strong id="countRemaining">0</strong></div>
      <div class="queue-copy">
        <strong id="queueState">准备中</strong>
        <span id="anchorState">尚未记录浏览位置</span>
      </div>
    </section>

    <section class="content-band">
      <div id="errorBanner" class="error-banner" hidden></div>
      <div id="liveGrid" class="live-grid" aria-live="polite"></div>
      <div id="emptyState" class="empty-state" hidden>当前目录没有可识别的 Live Photo 组件组</div>
    </section>
  </main>

  <div id="contextMenu" class="context-menu" hidden>
    <button type="button" data-export="photos">导入苹果照片（Live）</button>
    <button type="button" data-export="image">导出静态 JPG</button>
    <button type="button" data-export="movie">导出 MOV</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="plugin.js"></script>
  <script src="app.js"></script>
</body>
</html>
