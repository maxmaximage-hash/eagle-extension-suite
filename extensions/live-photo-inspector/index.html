<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAX Live Photo 静态照片信息</title>
  <style>
    :root { color-scheme: dark; font: 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body { background: transparent; color: #f4f6fa; }
    body[data-theme="LIGHT"], body[data-theme="LIGHTGRAY"] { color: #20242a; }
    .panel { padding: 10px 12px 12px; }
    .title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .title strong { font-size: 12px; }
    .title small { color: #94a0b5; font-size: 10px; }
    .hint { margin: 0 0 8px; color: #8da5c5; line-height: 1.45; }
    .drag-button { margin: 0 0 10px; padding: 6px 10px; border: 0; border-radius: 5px; background: #3678d4; color: #fff; cursor: pointer; }
    .drag-button:disabled { opacity: .65; cursor: default; }
    .grid { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 4px 10px; }
    .label { color: #9ca8ba; }
    .value { min-width: 0; overflow-wrap: anywhere; color: inherit; }
    .empty, .error { color: #c8d0dc; line-height: 1.5; }
    .error { color: #ff9f9f; }
    body[data-theme="LIGHT"] .label, body[data-theme="LIGHTGRAY"] .label { color: #657083; }
    body[data-theme="LIGHT"] .hint, body[data-theme="LIGHTGRAY"] .hint { color: #466b98; }
  </style>
</head>
<body data-theme="DARK">
  <section class="panel" id="app">
    <div class="empty">正在读取静态照片原始信息…</div>
  </section>
  <script src="renderer.js"></script>
</body>
</html>
