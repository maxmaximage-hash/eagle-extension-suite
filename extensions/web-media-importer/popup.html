<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>网页媒体保存至 Eagle</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      body { width: 330px; margin: 0; padding: 16px; background: Canvas; color: CanvasText; }
      h1 { margin: 0 0 6px; font-size: 16px; } p { margin: 0 0 14px; color: #777; font-size: 12px; line-height: 1.5; }
      button { width: 100%; min-height: 36px; border: 0; border-radius: 8px; background: #1769e0; color: #fff; font: inherit; cursor: pointer; }
      button:disabled { opacity: .55; cursor: default; } #status { min-height: 20px; margin: 10px 0; font-size: 12px; line-height: 1.45; }
      .queue { padding: 10px 0; border-top: 1px solid #ddd; } .queue strong { display: block; font-size: 12px; } .queue span { color: #777; font-size: 11px; }
      .queue button { width: auto; min-height: 28px; margin-top: 7px; padding: 0 9px; background: #555; font-size: 12px; }
      details { margin: 10px 0; font-size: 12px; } .settings { display: grid; grid-template-columns: 1fr 90px; gap: 7px; align-items: center; padding-top: 8px; }
      .settings input { min-width: 0; padding: 5px; } .settings button { grid-column: 1 / -1; min-height: 30px; }
    </style>
  </head>
  <body>
    <h1>网页媒体保存至 Eagle</h1>
    <p>只处理归属当前帖子/内容且通过文件真实性校验的媒体。YouTube 视频只保存封面。</p>
    <button id="save-page" type="button">保存当前帖子/内容</button>
    <details>
      <summary>安全上限</summary>
      <div class="settings">
        <label for="max-items">单批最多（项）</label><input id="max-items" type="number" min="1" max="200">
        <label for="max-item-mb">单项最多（MB）</label><input id="max-item-mb" type="number" min="1">
        <label for="max-batch-mb">单批最多（MB）</label><input id="max-batch-mb" type="number" min="1">
        <button id="save-settings" type="button">保存上限</button>
      </div>
    </details>
    <div id="status" role="status"></div>
    <div id="queues"></div>
    <script src="popup.js"></script>
  </body>
</html>
